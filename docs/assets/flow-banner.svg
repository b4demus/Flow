<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Flow — light, motion, color, time</title>
  <desc id="desc">Flowing mint and violet curves. 42 effects, 2 panels, one creative toolkit for After Effects.</desc>
